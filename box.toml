schema_version = 1

[box]
name = "site"
lifecycle = "persistent"
interactive = true
shell = "/bin/zsh"

[network]
mode = "deny"
allowlist = ["registry.npmjs.org:443", "github.com:443"]
dns = "localhost-only"

[permissions]
read = ["/Users/appleplay/.local", "/usr/local/bin"]
write = ["/Users/appleplay/.local", "/usr/local/bin"]

[env]
path_extra = [
  "/usr/local/bin",
  "/Users/appleplay/.local/bin",
  "/Users/appleplay/.local/share/nvm/versions/node/v22.23.2/bin",
]
set = { NVM_DIR = "/Users/appleplay/.local/share/nvm" }
